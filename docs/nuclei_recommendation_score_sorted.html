const el = id => document.getElementById(id);
const unique = arr => [...new Set(arr)].sort((a,b)=>String(a).localeCompare(String(b),'en'));
function options(id,values,desired){const e=el(id); e.replaceChildren();for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;e.appendChild(o);}if(values.includes(desired)) e.value=desired;}
function available(){return DATA.rows.filter(x=>x.profile===el('image').value);}
function changeTask(){const old=el('task').value;options('task',unique(available().map(x=>x.task)),old||'Morphometric analysis');changeEndpoint();}
function changeEndpoint(){const old=el('endpoint').value;const a=available().filter(x=>x.task===el('task').value);options('endpoint',unique(a.map(x=>x.endpoint)),old||'Overall morphology');changePriority();}
function changePriority(){const old=el('priority').value;const a=available().filter(x=>x.task===el('task').value&&x.endpoint===el('endpoint').value);options('priority',unique(a.map(x=>x.priority)),old||'Accuracy-first');changePrompt();}
function changePrompt(){const old=el('prompt').value;const a=available().filter(x=>x.task===el('task').value&&x.endpoint===el('endpoint').value&&x.priority===el('priority').value);options('prompt',unique(a.map(x=>x.prompt)),old||'No prompt');render();}
function addNames(target, models, emptyMessage){const root=el(target);root.replaceChildren();if(!models.length){const e=document.createElement('div');e.className='empty';e.textContent=emptyMessage||'No models';root.appendChild(e);return;}for(const m of models){const e=document.createElement('div');e.className='item';const name=document.createElement('span');name.textContent=m.model;const score=document.createElement('span');score.className='score';const value=document.createElement('strong');value.textContent=m.topsis_score==null?'—':Number(m.topsis_score).toFixed(3);const label=document.createElement('small');label.textContent=m.score_label||'TOPSIS score';score.append(value,label);e.append(name,score);root.appendChild(e);}}
function render(){const row=available().find(x=>x.task===el('task').value&&x.endpoint===el('endpoint').value&&x.priority===el('priority').value&&x.prompt===el('prompt').value);
const rec=row?row.ranking.filter(x=>x.level==='Recommended'):[];const acc=row?row.ranking.filter(x=>x.level==='Acceptable'):[];
const emptyMessage=row&&row.has_candidates&&!row.ranking.length?'No eligible models under the original quality gates.':'No models';addNames('recommended',rec,emptyMessage);addNames('acceptable',acc,emptyMessage);
el('nRecommended').textContent=rec.length+' models';el('nAcceptable').textContent=acc.length+' models';
const fallback=el('fallback');const fallbackList=el('fallbackList');fallback.style.display=row&&row.fallback?'block':'none';
fallbackList.replaceChildren();
if(row&&row.fallback){const m=row.fallback;const e=document.createElement('div');e.className='item';const n=document.createElement('span');n.textContent=m.model;
const score=document.createElement('span');score.className='score';const v=document.createElement('strong');v.textContent=Number(m.score).toFixed(3);
const l=document.createElement('small');l.textContent='Morphometry score (not TOPSIS)';score.append(v,l);e.append(n,score);fallbackList.append(e);
el('fallbackNote').textContent='Conditional candidate only — failed the original nucleus-count quality gate; excluded from Recommended / Acceptable and does not have a valid TOPSIS score.';}
}
options('image',DATA.profiles.map(x=>x.name),'H&E');el('image').addEventListener('change',changeTask);el('task').addEventListener('change',changeEndpoint);el('endpoint').addEventListener('change',changePriority);el('priority').addEventListener('change',changePrompt);el('prompt').addEventListener('change',render);
changeTask();
